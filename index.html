const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: u8(D.salt), iterations: D.it },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(D.iv) }, key, u8(D.ct));
  return new TextDecoder().decode(pt);
}
async function show(pw) {
  const html = await unlock(pw);
  try { sessionStorage.setItem("bw-pw", pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Sprawdzam…";
  try { await show(document.getElementById("pw").value); }
  catch (x) { err.textContent = "Nieprawidłowe hasło."; }
});
try { const saved = sessionStorage.getItem("bw-pw"); if (saved) show(saved).catch(() => {}); } catch (e) {}
</script>
